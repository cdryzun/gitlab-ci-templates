# Java Application - Prepare External Config Files Example
# Scenario: Package configuration files into image, override default config at runtime

include:
  - remote: 'https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/open/jobs-templates/Auto-DevOps.gitlab-ci.yml'

variables:
  # Maven build command
  BUILD_SHELL: "mvn clean package -Dmaven.test.skip=true"

  # Enable unit tests
  UNIT_TEST_ENABLE: "true"

  # Prepare config files
  DOCKER_WORKSPACE_PREPARE_CMD: |
    echo "Preparing Spring Boot external configuration files..."

    # Create config directory
    mkdir -p config

    # Copy application config files
    cp ${CI_PROJECT_DIR}/deploy/application.yml config/
    cp ${CI_PROJECT_DIR}/deploy/application-${BUILD_ENV}.yml config/

    # Copy logback config
    cp ${CI_PROJECT_DIR}/deploy/logback-spring.xml config/

    # Copy database config if exists
    if [ -f "${CI_PROJECT_DIR}/deploy/db.properties" ]; then
      cp ${CI_PROJECT_DIR}/deploy/db.properties config/
    fi

    # Generate startup script
    cat > start.sh << 'EOF'
    #!/bin/sh
    # Spring Boot startup script, using external config
    java -jar \
      -Dspring.config.location=/opt/deployments/config/ \
      -Dlogging.config=/opt/deployments/config/logback-spring.xml \
      -XX:+UseContainerSupport \
      -XX:MaxRAMPercentage=90.0 \
      /opt/deployments/${APP}.jar
    EOF

    chmod +x start.sh

    echo "Configuration files prepared:"
    ls -lha
    ls -lha config/

  # Use custom Dockerfile
  CUSTOM_DOCKERFILE_PATH: "docker/Dockerfile"

# Corresponding custom Dockerfile (docker/Dockerfile):
#
# ARG OPENJDK_VERSION=8-alpine
# FROM openjdk:${OPENJDK_VERSION}
#
# ARG APP_NAME="app"
# ENV APP=${APP_NAME}
#
# WORKDIR /opt/deployments
#
# # Copy JAR file
# COPY app*.jar /opt/deployments/${APP}.jar
#
# # Copy config directory
# COPY config/ /opt/deployments/config/
#
# # Copy startup script
# COPY start.sh /opt/deployments/
#
# RUN chown -R daemon:daemon /opt/deployments
# USER daemon
#
# # Use custom startup script
# CMD ["/opt/deployments/start.sh"]

# Project directory structure example:
# your-project/
# ├── src/
# ├── deploy/
# │   ├── application.yml
# │   ├── application-dev.yml
# │   ├── application-sit.yml
# │   ├── application-prd.yml
# │   ├── logback-spring.xml
# │   └── db.properties
# ├── docker/
# │   └── Dockerfile
# ├── pom.xml
# └── .gitlab-ci.yml
