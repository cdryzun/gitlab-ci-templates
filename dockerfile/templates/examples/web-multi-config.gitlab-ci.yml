# Web Application - Multi-Config File Preparation Example
# Scenario: Need to prepare multiple Nginx config files and SSL certificates

include:
  - remote: 'https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/open/jobs-templates/Auto-DevOps.gitlab-ci.yml'

variables:
  # Build command
  BUILD_SHELL: "pnpm run build"

  # Disable unit tests (optional)
  UNIT_TEST_ENABLE: "false"

  # Workspace preparation command
  # Executed in DOCKER_DAEMON_WORKSPACE directory
  DOCKER_WORKSPACE_PREPARE_CMD: |
    echo "Preparing Nginx config and SSL certificates..."

    # Copy Nginx main config
    cp ${CI_PROJECT_DIR}/config/nginx/nginx.conf .

    # Copy application specific config
    cp ${CI_PROJECT_DIR}/config/nginx/app.conf .

    # Create SSL directory and copy certificates
    mkdir -p ssl
    cp ${CI_PROJECT_DIR}/config/ssl/server.crt ssl/
    cp ${CI_PROJECT_DIR}/config/ssl/server.key ssl/
    chmod 600 ssl/server.key

    # Copy other config files
    cp ${CI_PROJECT_DIR}/config/mime.types .

    echo "Configuration files prepared!"
    ls -lha

# Project directory structure example:
# your-project/
# ├── src/
# ├── config/
# │   ├── nginx/
# │   │   ├── nginx.conf
# │   │   └── app.conf
# │   ├── ssl/
# │   │   ├── server.crt
# │   │   └── server.key
# │   └── mime.types
# ├── package.json
# └── .gitlab-ci.yml
