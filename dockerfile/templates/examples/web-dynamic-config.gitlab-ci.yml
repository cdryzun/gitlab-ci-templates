# Web Application - Dynamic Config Generation Example
# Scenario: Select config files dynamically based on branch/environment

include:
  - remote: 'https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/open/jobs-templates/Auto-DevOps.gitlab-ci.yml'

variables:
  BUILD_SHELL: "pnpm run build"
  UNIT_TEST_ENABLE: "false"

  # Select config dynamically based on branch
  DOCKER_WORKSPACE_PREPARE_CMD: |
    echo "Current branch: ${CI_COMMIT_REF_NAME}"
    echo "Build environment: ${BUILD_ENV}"

    # Select different Nginx config based on branch
    if [ "${CI_COMMIT_REF_NAME}" = "prd" ] || [[ "${CI_COMMIT_REF_NAME}" =~ ^v[0-9] ]]; then
      echo "Using production environment config..."
      cp ${CI_PROJECT_DIR}/config/nginx.prod.conf nginx.conf
      cp ${CI_PROJECT_DIR}/config/app.prod.json app.json
    elif [ "${CI_COMMIT_REF_NAME}" = "sit" ]; then
      echo "Using test environment config..."
      cp ${CI_PROJECT_DIR}/config/nginx.sit.conf nginx.conf
      cp ${CI_PROJECT_DIR}/config/app.sit.json app.json
    else
      echo "Using development environment config..."
      cp ${CI_PROJECT_DIR}/config/nginx.dev.conf nginx.conf
      cp ${CI_PROJECT_DIR}/config/app.dev.json app.json
    fi

    # Generate build metadata file
    cat > build-info.json << EOF
    {
      "version": "${CI_COMMIT_SHORT_SHA}",
      "branch": "${CI_COMMIT_REF_NAME}",
      "build_time": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
      "environment": "${BUILD_ENV}",
      "pipeline_id": "${CI_PIPELINE_ID}"
    }
    EOF

    echo "Configuration files prepared:"
    ls -lha
    echo "Application config content:"
    cat app.json

# Project directory structure example:
# your-project/
# ├── src/
# ├── config/
# │   ├── nginx.dev.conf       # Development Nginx config
# │   ├── nginx.sit.conf       # Test Nginx config
# │   ├── nginx.prod.conf      # Production Nginx config
# │   ├── app.dev.json         # Development application config
# │   ├── app.sit.json         # Test application config
# │   └── app.prod.json        # Production application config
# ├── package.json
# └── .gitlab-ci.yml
