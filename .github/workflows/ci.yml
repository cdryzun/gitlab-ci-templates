name: CI

on:
  push:
    branches: [ main, open ]
  pull_request:
    branches: [ main, open ]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Fetch full history so gitleaks can scan all commits, not just HEAD
        fetch-depth: 0

    - name: Run gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Only required for organizations
      with:
        config-path: .gitleaks.toml

  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install yamllint
      run: pip install yamllint

    - name: Lint template YAML files
      run: yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}}}" templates/*.yml jobs-templates/*.yml

    - name: Lint variable YAML files
      run: yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}}}" vars/*.yml

    - name: Lint utility YAML files
      run: yamllint -d "{extends: relaxed, rules: {line-length: {max: 120}}}" utils/*.yml

  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install shellcheck
      run: sudo apt-get install -y shellcheck

    - name: Run shellcheck on all scripts
      run: |
        shellcheck_exit=0
        for script in scripts/*.sh; do
          echo "Checking ${script}..."
          # SC1090: Can't follow sourced files (expected in CI template context)
          # SC1091: Not following sourced files
          # SC2034: Variable appears unused (many are used by sourcing scripts)
          # SC2154: Variable referenced but not assigned (assigned by GitLab CI)
          shellcheck -e SC1090,SC1091,SC2034,SC2154 -S warning "${script}" || shellcheck_exit=1
        done
        exit ${shellcheck_exit}

  validate-templates:
    name: Validate Templates
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check stable/latest file pairs
      run: |
        echo "Checking that all stable templates have corresponding latest versions..."
        exit_code=0
        for stable_file in templates/*.stable.*.yml jobs-templates/*.stable.*.yml; do
          latest_file="${stable_file//.stable./.latest.}"
          if [ ! -f "${latest_file}" ]; then
            echo "WARNING: Missing latest counterpart for ${stable_file}"
          fi
        done

    - name: Check shell script shebangs
      run: |
        exit_code=0
        for script in scripts/*.sh; do
          first_line=$(head -n 1 "${script}")
          if [[ "${first_line}" != "#!/usr/bin/env bash" ]]; then
            echo "ERROR: ${script} has non-portable shebang: ${first_line}"
            exit_code=1
          fi
        done
        exit ${exit_code}

    - name: Check shell script set flags
      run: |
        exit_code=0
        for script in scripts/*.sh; do
          # Skip utility/module scripts that are sourced (start with _)
          basename=$(basename "${script}")
          if [[ "${basename}" == _* ]]; then
            continue
          fi
          if ! grep -q "set -euo pipefail" "${script}"; then
            echo "ERROR: ${script} missing 'set -euo pipefail'"
            exit_code=1
          fi
        done
        exit ${exit_code}

  check-docs:
    name: Check Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check required files exist
      run: |
        required_files=(
          "README.md"
          "LICENSE"
          "CONTRIBUTING.md"
          "CHANGELOG.md"
          "SECURITY.md"
        )
        exit_code=0
        for file in "${required_files[@]}"; do
          if [ ! -f "${file}" ]; then
            echo "ERROR: Missing required file: ${file}"
            exit_code=1
          fi
        done
        exit ${exit_code}
