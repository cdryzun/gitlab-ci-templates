name: CI

on:
  push:
    branches: [ main, open ]
  pull_request:
    branches: [ main, open ]

jobs:
  lint-yaml:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install yamllint
      run: pip install yamllint

    - name: Lint YAML files
      run: |
        yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}, truthy: disable, empty-lines: {max: 3}}}" \
          templates/*.yml jobs-templates/*.yml vars/*.yml utils/*.yml

  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run shellcheck
      run: |
        exit_code=0
        for script in scripts/*.sh; do
          echo "Checking ${script}..."
          shellcheck -e SC1078,SC1090,SC1091,SC2010,SC2027,SC2034,SC2045,SC2046,SC2086,SC2006,SC2145,SC2154,SC2155,SC2163,SC2164,SC2166,SC2206,SC2207,SC2209 \
            -S warning "${script}" || exit_code=1
        done
        exit ${exit_code}

  validate:
    name: Validate Templates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Check shebangs
      run: |
        exit_code=0
        for script in scripts/*.sh; do
          first_line=$(head -n 1 "${script}")
          if [[ "${first_line}" != "#!/usr/bin/env bash" ]]; then
            echo "ERROR: ${script} shebang: ${first_line}"
            exit_code=1
          fi
        done
        exit ${exit_code}

    - name: Check set flags
      run: |
        exit_code=0
        for script in scripts/*.sh; do
          basename=$(basename "${script}")
          [[ "${basename}" == _* || "${basename}" == "example_usage.sh" || "${basename}" == "pre."* || "${basename}" == "secretsToFile"* ]] && continue
          if ! grep -q "set -e" "${script}" || ! grep -q "pipefail" "${script}"; then
            echo "ERROR: ${script} missing pipefail"
            exit_code=1
          fi
        done
        exit ${exit_code}

    - name: Check required files
      run: |
        for f in README.md LICENSE CONTRIBUTING.md CHANGELOG.md SECURITY.md; do
          test -f "$f" || { echo "Missing: $f"; exit 1; }
        done

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install gitleaks
      run: |
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
          | tar xz -C /usr/local/bin gitleaks

    - name: Run gitleaks
      continue-on-error: true
      run: gitleaks detect --source . --config .gitleaks.toml --verbose
