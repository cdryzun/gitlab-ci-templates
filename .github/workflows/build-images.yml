name: Build and Push Docker Images

on:
  push:
    branches:
      - open
    paths:
      - 'images/**'
      - '.github/workflows/build-images.yml'
  pull_request:
    paths:
      - 'images/**'
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build (all, java, nodejs, python, golang, golang-nodejs, toolbox, nginx, openjdk, alpine)'
        required: true
        default: 'all'
      push:
        description: 'Push to registry'
        required: true
        default: 'true'
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_OWNER: cdryzun

jobs:
  # ===========================================
  # Builder Images
  # ===========================================

  build-java:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'java' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: ['8', '11', '17']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/builders/java
          file: images/builders/java/Dockerfile.jdk${{ matrix.jdk }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-java:jdk${{ matrix.jdk }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-java:jdk${{ matrix.jdk }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-nodejs:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'nodejs' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/builders/nodejs
          file: images/builders/nodejs/Dockerfile
          build-args: |
            NODE_VERSION=${{ matrix.node }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-nodejs:${{ matrix.node }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-nodejs:${{ matrix.node }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-python:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'python' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/builders/python
          file: images/builders/python/Dockerfile
          build-args: |
            PYTHON_VERSION=${{ matrix.python }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-python:${{ matrix.python }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-python:${{ matrix.python }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-golang:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'golang' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21', '1.22', '1.23']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/builders/golang
          file: images/builders/golang/Dockerfile
          build-args: |
            GO_VERSION=${{ matrix.go }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-golang:${{ matrix.go }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-golang:${{ matrix.go }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-golang-nodejs:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'golang-nodejs' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - go: '1.22'
            node: '20'
          - go: '1.23'
            node: '20'
          - go: '1.23'
            node: '22'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/builders/golang-nodejs
          file: images/builders/golang-nodejs/Dockerfile
          build-args: |
            GO_VERSION=${{ matrix.go }}
            NODE_VERSION=${{ matrix.node }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-golang-nodejs:go${{ matrix.go }}-node${{ matrix.node }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-builder-golang-nodejs:go${{ matrix.go }}-node${{ matrix.node }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-toolbox:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'toolbox' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/builders/toolbox
          file: images/builders/toolbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-toolbox:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-toolbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================
  # Runtime Images
  # ===========================================

  build-nginx:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'nginx' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nginx: ['1.24', '1.25']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/runtimes/nginx
          file: images/runtimes/nginx/Dockerfile
          build-args: |
            NGINX_VERSION=${{ matrix.nginx }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-runtime-nginx:${{ matrix.nginx }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-openjdk:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'openjdk' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        jdk: ['8', '11', '17']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/runtimes/openjdk
          file: images/runtimes/openjdk/Dockerfile.jdk${{ matrix.jdk }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-runtime-openjdk:jdk${{ matrix.jdk }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-alpine:
    if: ${{ github.event.inputs.image == 'all' || github.event.inputs.image == 'alpine' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/runtimes/alpine-base
          file: images/runtimes/alpine-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-runtime-alpine:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/glci-runtime-alpine:3.19
          cache-from: type=gha
          cache-to: type=gha,mode=max
