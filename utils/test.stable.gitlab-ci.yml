
.unit_test_base:
  extends:
    - .runner_tag
    - .nexus_auth
    - .sonar_auth
    - .build_before_jobs
    - .build_after_script


###################### Below this line are code snippets split by function or module
.code_maven_test: &code_maven_test
  - |
    set -x
    shell_exec "${TEST_SHELL:-"mvn test"}"

.code_npm_test: &code_npm_test
  - |
    set -x
    if [ "${PACKAGE_MANAGER}" == 'yarn' ];then
        shell_exec "${TEST_SHELL:-"yarn run test"}"
    else
        shell_exec "${TEST_SHELL:-"pnpm run test"}"
    fi

.maven_test:
  stage: test
  image: ${MAVEN_IMAGE}
  rules:
    - if: $MAVEN_TEST == "true"
  script:
    - !reference [ .maven-generate-config, script ]
    - *code_maven_test

.gradle_test:
  stage: test
  image: ${GRADLE_IMAGE:-${MAVEN_IMAGE}}
  rules:
    - if: $GRADLE_TEST == "true"
  script:
    - |
      set -x
      shell_exec "${TEST_SHELL:-"gradle test"}"

.npm_test:
  stage: test
  image: ${NODE_IMAGE}
  rules:
    - if: $NPM_TEST == "true"
  script:
    - !reference [ .npm-generate-config, script ]
    - *code_npm_test
  artifacts:
    expire_in: 14 days
    reports:
      cobertura: coverage/clover.xml

# Junit unit test
.junit_test:
  stage: test
  script:
    - $TEST_SHELL
    - ls
  artifacts:
    expire_in: 14 days
    reports:
      junit: ${JUNIT_REPORT_PATH}

.py_test:
  stage: test
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    expire_in: 14 days
    when: always
    reports:
      junit: coverage/report.xml
  rules:
    - if: $PY_TEST == "true"
  script:
    - |
      set -x
      if [-e /sbin/apk ];then
        apk --no-cache add gcc g++ musl-dev
      else
        apt update
        apt install gcc g++ -y
      fi
    - |
      set -x
      if [ -e requirements.txt ];then 
        pip3 install -r requirements.txt -i ${PYPI}
      else
        pip3 install pytest pytest-cov -i ${PYPI}
      fi
    # If below the defined minimum coverage, interrupt CI and output current coverage result.
    - python3 -m pytest | awk -F'[% ]+' -vm=$MIN_COVERAGE '/TOTAL/{if($(NF-1)>=m){print $0;exit 0}else{print $0;exit 1}}'

.go_test:
  stage: test
  image: ${GO_IMAGE}
  coverage: '/^coverage:\s+(\d+(?:\.\d+)?%)/'
  rules:
    - if: $GO_TEST == "true"
  artifacts:
    expire_in: 14 days
    when: always
    reports:
      junit: ${GO_JUNIT_REPORT_PATH:-coverage/report.xml}
  script:
    - |
      set -x
      if [ -f go.mod ]; then
          echo "module found, start to download dependencies..."
      fi
      # Apply GOPROXY/GOPRIVATE if configured
      if [ -n "${GO_GOPROXY}" ]; then export GOPROXY="${GO_GOPROXY}"; fi
      if [ -n "${GO_GOPRIVATE}" ]; then
        export GOPRIVATE="${GO_GOPRIVATE}"
        export GONOSUMDB="${GO_GOPRIVATE}"
      fi
      # GO_TEST_FLAGS supports custom flags (e.g. "-run TestFoo")
      # Default: -v for output, -race for data race detection, -count=1 to disable test cache
      _GO_TEST_FLAGS="${GO_TEST_FLAGS:--v -race -count=1}"
      if [ -n "${TEST_SHELL}" ]; then
        sh -c "${TEST_SHELL}"
      else
        go test ${_GO_TEST_FLAGS} -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out | tail -1
      fi
