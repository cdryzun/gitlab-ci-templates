.general_stage:
  stages:
    - sonar
    - test
    - build
    - scan
    - deploy
    - rollback

###################### Below this line are code snippets split by function or module
.runner_tag:
  tags:
    - "${RUNNER}"

.job-retry:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.node-cache:
  cache:
    untracked: true
    key: "${CI_PROJECT_NAME}"
    paths:
      - "node_modules"

.load_artifacts_env:
  dependencies:
    - pre



# Open Source Version - Tool shell functions
# These functions are loaded in the before stage and available throughout the pipeline

# Tool shell functions, loaded in the before stage to empower the entire stage phase
.utils_shell_function:
  script:
    - |
      function shell_exec(){
          echo "${1}"|bash
      }
      # Load shell execution function to prevent alias invalidation issue, depends on bash interpreter usage
      # Usage example: shell_exec "${BUILD_SHELL}"
    - |
      # Download script from GitHub raw URL
      # Usage: script_download _utils.stable.sh _utils.sh (optional, defaults to run.sh)
      function script_download(){
        set +x
        local script_name="${1}"
        local output_name="${2:-run.sh}"
        local _auth_header=""
        if [ -n "${CI_JOB_TOKEN:-}" ]; then
          _auth_header="JOB-TOKEN: ${CI_JOB_TOKEN}"
        fi
        curl --retry 3 --retry-delay 2 --max-time 30 -fsSL ${_auth_header:+-H "${_auth_header}"} "${TEMPLATE_REPO_RAW_URL}/scripts/${script_name}" -o "${output_name}"
        set -x
      }
    - |
      function dockerfile_download(){
        set +x
        local dockerfile_name="${1}"
        local output_name="${2:-Dockerfile}"
        local _auth_header=""
        if [ -n "${CI_JOB_TOKEN:-}" ]; then
          _auth_header="JOB-TOKEN: ${CI_JOB_TOKEN}"
        fi
        curl --retry 3 --retry-delay 2 --max-time 30 -fsSL ${_auth_header:+-H "${_auth_header}"} "${TEMPLATE_REPO_RAW_URL}/dockerfile/${dockerfile_name}" -o "${DOCKER_DAEMON_WORKSPACE}/${output_name}"
        set -x
      }
