
###################### 此分割线以下放置 拆分成段的 代码段；按功能 or 模块 进行拆分
.build_after_script:
  after_script:
    - |
      set -x
      rm -rf ~/.ssh || true
      rm -rf ~/.ash_history || true
      rm -rf ~/.bash_history || true
    - |
      # 清理docker login 锁文件
      rm -rf ~/.docker-lock/${CI_PIPELINE_ID}-${CI_JOB_NAME}.lock || true
      # 当锁文件都被正常释放后, 才做退出操作
      if [ `ls ~/.docker-lock/*.lock|wc -l` -eq 0 ];then
          docker logout ${HARBOR_URL##https://}
          rm -rf ~/.config/glab-cli/config.yml || true
      fi

.clean_auth_files:
  after_script:
    - rm -rf ~/.npmrc || true
    - rm -rf ~/.ssh || true
    - rm -rf ~/.ash_history || true
    - rm -rf ~/.bash_history || true
    - rm -rf ~/.pip/pip.conf || true
    