# Since before_script in the current GitLab version v14.5.1 cannot anchor common before_script stages,
# common stages are written separately for now.
# Code build before_script
# Note: Tools (docker, glab, helm, argocd) are pre-installed in glci-toolbox image
.build_before_jobs:
  before_script:
    - !reference [ .utils_shell_function, script ]
    - !reference [ .alias, script ]
    - !reference [ .check_curl, script ]
    - !reference [ .npm_before_jobs, script ]
    - !reference [ .check_docker, script ]
    - !reference [ .docker_login, script ]
    - !reference [ .maven-generate-config, script ]
    - !reference [ .npm-generate-config, script ]
    - !reference [ .pypi-generate-config, script ]
    - !reference [ .check_glab, script ]

# SonarQube code scan before_script
.sonar_before_jobs:
  before_script:
    - !reference [ .utils_shell_function, script ]
    - !reference [ .maven-generate-config, script ]
    - !reference [ .npm-generate-config, script ]
    - !reference [ .pypi-generate-config, script ]
    - !reference [ .alias, script ]

# Image scan before_script
.scan_before_jobs:
  before_script:
    - !reference [ .utils_shell_function, script ]
    - !reference [ .alias, script ]
    - !reference [ .docker_login, script ]

# Deploy stage before_script
.deploy_before_jobs:
  before_script:
    - !reference [ .utils_shell_function, script ]
    - !reference [ .alias, script ]

# Load built-in shell functions from template
.load_function_before_jobs:
  before_script:
    - !reference [ .utils_shell_function, script ]

###################### Below this line are code snippets split by function or module

# Note: docker CLI is pre-installed in glci-toolbox image
.check_docker:
  script:
    - |
      # Check if docker command exists (only when building Docker images)
      if [ "${DOCKER_IMAGE_BUILD}" == "true" ]; then
        if [ ! -e /usr/local/bin/docker ] && [ ! -e /usr/bin/docker ]; then
          echo "Error: docker CLI not found. Please use glci-toolbox image."
          exit 1
        fi
      fi
      # Initialize docker workspace
      mkdir -p ${DOCKER_DAEMON_WORKSPACE}

# Note: glab CLI is pre-installed in glci-toolbox image
.check_glab:
  script:
    - |
      # Check if glab command is installed
      if [ ! -e /usr/local/bin/glab ] && [ ! -e /usr/bin/glab ]; then
        echo "Warning: glab CLI not found. Please use glci-toolbox image."
      fi

.npm_before_jobs:
  script:
    - |
      # Whether to clean pnpm lock files
      if [ "${PNPM_LOCKFILE_DISABLE}" == "true" ]; then
        ls yarn.lock package-lock.json pnpm-lock.yaml || true
        rm -rf yarn.lock package-lock.json pnpm-lock.yaml
      fi
    - |
      # Check whether to disable cache when building with package manager
      if [ "${NODE_CACHE_DISABLE}" == "true" ]; then
        if [ "${PACKAGE_MANAGER}" == 'yarn' ]; then
          yarn cache clean
        else
          pnpm store prune
        fi
      fi

.alias:
  script:
    - |
      # Set alias commands
      cat > "${BASH_ENV}" << EOF
      alias mvn="mvn --settings=${CI_PROJECT_DIR}/.settings.xml"
      shopt -s expand_aliases
      EOF

# Note: helm CLI is pre-installed in glci-toolbox image
.check_helm:
  script:
    - |
      if [ ! -e /usr/local/bin/helm ]; then
        echo "Warning: helm CLI not found. Please use glci-toolbox image."
      fi

.check_curl:
  script:
    - |
      if [ ! -e /usr/bin/curl ]; then
        echo "Error: curl not found. Please use glci-toolbox image."
        exit 1
      fi

.docker_login:
  script:
    - |
      # Docker login with password-stdin to avoid CLI security warning
      if [ -n "${REGISTRY_USER}" ] && [ -n "${REGISTRY_PASSWORD}" ]; then
        echo "${REGISTRY_PASSWORD}" | docker login --username "${REGISTRY_USER}" --password-stdin "${DOCKER_REGISTRY}" 2>/dev/null
      elif [ -n "${HARBOR_USER}" ] && [ -n "${HARBOR_PASSWD}" ]; then
        # Backward compatibility
        echo "${HARBOR_PASSWD}" | docker login --username "${HARBOR_USER}" --password-stdin "${DOCKER_REGISTRY}" 2>/dev/null
      fi
      # Create docker login lock file
      mkdir -p ~/.docker-lock
      touch ~/.docker-lock/${CI_PIPELINE_ID}-${CI_JOB_NAME}.lock

.sonar_check:
  script:
    - |
      # Generate required dependency binary directory when scanning Java project with SonarQube
      set -x
      if [ -f pom.xml ] && [ ! -d target/classes ]; then
        if [ -n "${TEST_SHELL}" ]; then
          shell_exec "${TEST_SHELL}"
        else
          shell_exec "${BUILD_SHELL}"
        fi
      fi
