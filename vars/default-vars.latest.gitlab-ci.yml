.default_vars:
    # 默认使用的 runner tag
    RUNNER: k3s-paas

    # 此段中的变量由 gitlab 使用使用全局变量进行配置 
    # TEMPLATE_REPO: "${CI_PROJECT_URL}"
    # TEMPLATE_REPO_PROJECT_ID: "${CI_PROJECT_ID}"

    # 指定 ci template 仓库所使用的分支是哪个，默认 master
    TEMPLATE_BRANCH_NAME: "devops"
    # argocd server address，依赖密钥，封装在 vautl 中
    ARGOCD_SERVER: "argocd.cpinnov.run:443"

    # 继承父进程环境变量和别名时，所使用的临时暂存文件
    BASH_ENV: "${CI_PROJECT_DIR}/_alias"
    ENV_FILE: "build.env" # artifacts:reports:dotenv 所指定的文件 ，docs: https://docs.gitlab.com/ee/ci/yaml/artifacts_reports.html#artifactsreportsdotenv
    CI_DEBUG_TRACE: "false" # 开启 CI pipeline log 详细日志
    LOG_LEVEL: "info" # job 中 脚本执行 log 等级，如 “CI_DEBUG_TRACE” 开启后将自动设置为 debug
    extends:
      - .test_vars
      - .scan_vars
      - .build_vars
      - .cd_vars
      - .default_iamge_vars
      - .repo_list_vars
      - .vault_vars
      - .image_scan

# 是否开启单元测试
.test_vars:
  UNIT_TEST_ENABLE: "true"
  PYTHON_UNIT_TEST_SHELL: ""
  NODE_UNIT_TEST_SHELL: ""
  GO_UNIT_TEST_SHELL: ""
  JAVA_UNIT_TEST_SHELL: ""
  MAVEN_TEST: "false"
  GRADLE_TEST: "false"

  # 进行单元测试时所使用的命令，使用 bash 为其设置 初始值 ${TEST_SHELL:-"xxx"}
  # TEST_SHELL: ""

# sonarqube 扫描相关变量
.scan_vars:
  # 使用的 sonarqube 连接地址
  SONAR_URL: "https://sonarqube.cpinnov.run"
  # 默认预设通用工程sonar扫描目录，多个已逗号相连接
  SONAR_DIR: "./src"
  # 配置在扫描时 sonarqube 所传入的 args 参数
  SONAR_SCAN_ARGS: ""
  # java工程maven集成sonar扫描，与下面的 SONAR_COMMON 二选一
  SONAR_MAVEN: "false"
  # 非java通用sonar扫描
  SONAR_COMMON: "true"
  # 开启强制sonar检测，扫描结果不满足规则就中断CI, 后端会使用正则，对重要的分支进行强制开启。
  SONAR_GATE: "false"
  # sonarqube 扫描的 二级制程序目录，一般无需修改
  SONAR_BINARIES: 'target/classes'
  # sonarqube 扫描的 测试二级制程序目录，一般无需修改
  SONAR_TEST_BINARIES: 'target/test-classes'
  # 单元测试覆盖率最小百分比,不满足这个条件则中断CI
  MIN_COVERAGE: "80"

# 镜像 & 构建 相关变量
.build_vars:
  # 前端构建使用的包管理器 (pnpm/yarn)
  PACKAGE_MANAGER: "pnpm"
  # 关闭前端缓存
  NODE_CACHE_DISABLE: "false"
  # NODE 构建使用使用到的 额外参数
  NODE_OPTIONS: "--max_old_space_size=4096"
  # 前端打包生成的静态文件夹, 默认 dist 无需设置更改
  STATIC_FILE_NAME: ""
  # maven 打包后 生成的 jar 包名称, 可以设置 gitlab-ci 内置变量 ${CI_PROJECT_NAME}, 默认为 app 无需设置
  MAVEN_APP_NAME: "app"
  # 默认构建maven类库
  BUILD_MAVEN_SNAPSHOT: "false"
  # 默认构建的镜像名字，此处配置将不会生效, 在 ci pre 阶段进行处理
  IMG_NAME: "${HARBOR_URL}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}"
  # 程序构建时的 command
  #BUILD_SHELL: "mvn clean package -Dmaven.test.skip=true"
  #BUILD_SHELL: "mvn clean package"

  # 是否要在 pnpm install 时，不去找 pnpm lock file 中的依赖
  PNPM_LOCKFILE_DISABLE: "false"
  # DEV 镜像的前缀  dev-xxx
  DEV_DOCKER_TAG_PERFIX: "${CI_COMMIT_REF_NAME}"
  # docker daemon build image workspace
  DOCKER_DAEMON_WORKSPACE: './docker-build'
  # docker 镜像对应的版本号，当为 release 版本时 使用 ${CI_COMMIT_REF_NAME} 变量，否则使用 ${DEV_DOCKER_TAG_PERFIX}-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID} 此版本号
  DOCKER_IMAGE_TAG: ""

  # 是否构建 release 镜像，默认开关为 false，后续使用正则进行判断
  RELEASE_BUILD: "false"
  # 默认是否构建 docker 镜像
  DOCKER_IMAGE_BUILD: "true"
  # feat | hotfix | bugfix 特性分支是否构建 docker 镜像，默认关闭
  FEAT_DOCKER_IMAGE_BUILD: "false"
  # docker build 时 添加的额外参数，如 "--no-cache" 构建时不添加缓存，多个参数使用 空格符号区分
  DOCKER_BUILD_FLAGS: '--no-cache'
  # 指定要使用的自定义nginx配置，默认为项目下的docker/nginx.conf
  CUSTOM_NGINX_CONF: "docker/nginx.conf"
  # 指定当前项目自定义的 Dockerfile 文件路径，支持相对路径或绝对路径，留空则使用默认模板
  CUSTOM_DOCKERFILE_PATH: ""
  # 是否使用自定义 Dockerfile（由 pre 阶段自动检测设置，通常无需手动配置）
  CUSTOM_DOCKERFILE: ""
  # Docker 构建工作区前置准备命令，在 DOCKER_DAEMON_WORKSPACE 目录下执行
  # 用于准备 Dockerfile 构建所需的依赖配置文件（如 nginx.conf, config.json 等）
  # 示例: "cp ${CI_PROJECT_DIR}/config/nginx.conf . && cp ${CI_PROJECT_DIR}/config/app.conf ."
  DOCKER_WORKSPACE_PREPARE_CMD: ""
  # 默认 maven 工程，输出结果所使用的 POM file
  BUILD_MAVEN_POM_FILE: "pom.xml"
  # prd ci 中自动创建的 Tag，最大保留数量，默认 20
  PRD_CD_CREATE_TAG_NUM: "20"
  # RELASE Create notes message
  PRD_CD_CREATE_TAG_MESSAGE: "notes message by gitlab-ci pipeline in change-manifests task"
  # 是否 在运行 prd 分支的 pipeline 时自动 create  Tag，默认为真
  PRD_BUILD_CREATE_TAG: "true"
  # 是否开启脚手架工程构建，此开关且面向 JAVA 工程
  RELEASE_LIB_BUILD: "false"
  # 脚手架工程 是否构建 snapshots 版本
  SNAPSHOTS_LIB_BUILD: "true"
  # 开启 Docker buildkit,  内置变量勿动
  DOCKER_BUILDKIT: 1

# CD 部署环境变量 ，docs-url:  https://confluence.iquantex.com/pages/viewpage.action?pageId=114175811
.cd_vars:
  # tag 的 image build 阶段是否关闭 retag，而选择重新构建生成
  RELEASE_RETAG_DISABLE: "false"
  # 自动 commit 中 使用的名字
  GIT_AUTO_COMMIT_NAME: "ci-cd"
  # 自动 commit 中 使用的邮箱
  GIT_AUTO_COMMIT_EMAIL: "ci-cd@cpinnov.run"
  # CD 部署阶段所使用的镜像名称，设置后将替换 "${DEV_DOCKER_TAG_PERFIX}-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}" 这个默认版本
  CD_DEPLOY_IMGAGE: ""
  # 默认 commit push 的远端分支
  REMOTE_BRANCH: "dev"
  # ci 自动提交到 charts 仓库中的 commit message 信息，可以使用内置 "变量"
  DEPLOY_COMMIT_MESSAGE: "helm values updated by gitlab-ci pipeline in change-manifests task. Trigger by ${GITLAB_USER_NAME}"
  ROLLBACK_COMMIT_MESSAGE: "helm values rollback by gitlab-ci pipeline in change-manifests task. Trigger by ${GITLAB_USER_NAME}"
  # 生成的 tag 将替换到 yaml 中的哪个字段
  DEPLOY_REPO_YAML_TAG: ".image.tag"
  # tag 需要指定哪一个文件进行替换
  DEPLOY_VALUE_FILE: "values.yaml"
  # cd 部署阶段 当前所关联的 文件夹目录，默认为当前的 CI_PROJECT_NAME
  DEPLOY_REPO_PROJ: ""
  # cd 回滚时需要的 变量收集文件
  CD_ENV_FILE: "cd.env"
  # feat 特性分支，CD 自动部署至 对应的 Charts 仓库，依赖变量 DEPLOY_REPO，默认为关
  FEAT_CD_AUTO_DEPLOY: "false"
  # dev、sit、prd 环境，CD 自动部署至 对应的 Charts 仓库，依赖变量 DEPLOY_REPO，默认为开
  DEV_CD_AUTO_DEPLOY: "true"
  SIT_CD_AUTO_DEPLOY: "true"
  PRD_CD_AUTO_DEPLOY: "true"
  # prd 分支，运行 pipeline 时是否 自动创建分支，默认为 开
  PRD_CD_CREATE_TAG: "true"
  DOCKERFILE_BUILD_JDK_VERSION: "jdk17"

# 默认的镜像列表
.default_iamge_vars:
  # 流水线构建阶段使用的基础构建镜像，将根据项目类型自动选择对应的镜像
  # 如需覆盖特定项目类型的构建镜像，请直接设置此变量
  BASE_BUILD_IMAGE: ""
  MAVEN_IMAGE: "harbor.cpinnov.run/library/base-image:gradle-maven-sonar-jdk17-debian"
  GRADLE_IMAGE: "harbor.cpinnov.run/library/base-image:gradle-maven-sonar-jdk17-debian"
  NODE_IMAGE: "harbor.cpinnov.run/library/base-image:nodejs-12-with-tools-debian"
  SONAR_IMAGE: "harbor.cpinnov.run/library/base-image:gradle-maven-sonar-jdk17-debian"
  TOOLBOX_IMAGE: "harbor.cpinnov.run/library/base-image:ci-buildbox"
  PYTHON_IMAGE: "harbor.cpinnov.run/library/base-image:micromamba-1.1.0"
  GO_IMAGE: "harbor.cpinnov.run/library/base-image:golang1.25.0-rk-debian-amd64"
  CD_DEPLOY_IMAGE: "${TOOLBOX_IMAGE}"
  TEST_IMAGE: "${TOOLBOX_IMAGE}"

# 工具私服地址变量
.repo_list_vars:
  # harbor docker 私服地址
  HARBOR_URL: "harbor.cpinnov.run"
  NEXUS_URL: "https://nexus.cpinnov.run"
  NODE_REGISTRY: "https://registry.npmmirror.com"
  PYPI: "https://nexus.cpinnov.run/repository/pypi/simple/"
  PYPI_PRIVATE: "https://nexus.cpinnov.run/repository/pypi-local/"
  MAVEN_REGISTRY: "https://nexus.cpinnov.run/repository/maven-public/"

# vault连接相关控制变量，默认
.vault_vars:
  # VAULT_SERVER_URL: "https://vault.cpinnov.run"
  VAULT_AUTH_ROLE: "ci-vault"
  VAULT_AUTH_PATH: "jwt"

# artifacts 默认配置
.default_artifacts:
  artifacts:
    expire_in: 14 days

# docker 镜像扫描相关变量
.image_scan:
  # 扫描镜像安全漏洞
  DOCKER_IMAGE_SCAN_IMAGE: "true"
  DOCKER_IMAGE_SCAN_SERVER: "http://10.16.18.166:28080"
  # 如果扫描 iamge 漏洞等级为中高以上时 是否强制中断CI
  ENFORCE_EXIT: "false"
  # gitlab 容器扫描变量
  CS_ANALYZER_IMAGE: "proxyhub.cpinnov.run/cloudir/container-scanning:latest"
  IMAGE_NAME: "$IMG_NAME"
  CI_REGISTRY_IMAGE: "$IMAGE_NAME"