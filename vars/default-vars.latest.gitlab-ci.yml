.default_vars:
    # Default runner tag
    RUNNER: default

    # Template repository - GitHub raw URL for open source
    TEMPLATE_BRANCH_NAME: "open"
    TEMPLATE_REPO_RAW_URL: "https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/${TEMPLATE_BRANCH_NAME}"

    # ArgoCD server address (configure in your GitLab CI/CD variables)
    # ARGOCD_SERVER: "argocd.example.com:443"

    # Temporary staging file for inheriting parent process environment variables and aliases
    BASH_ENV: "${CI_PROJECT_DIR}/_alias"
    ENV_FILE: "build.env"
    CI_DEBUG_TRACE: "false"
    LOG_LEVEL: "info"
    extends:
      - .test_vars
      - .scan_vars
      - .build_vars
      - .cd_vars
      - .default_image_vars
      - .repo_list_vars
      - .tools_download_vars
      - .vault_vars
      - .image_scan

# Whether to enable unit testing
.test_vars:
  UNIT_TEST_ENABLE: "true"
  PYTHON_UNIT_TEST_SHELL: ""
  NODE_UNIT_TEST_SHELL: ""
  GO_UNIT_TEST_SHELL: ""
  JAVA_UNIT_TEST_SHELL: ""
  MAVEN_TEST: "false"
  GRADLE_TEST: "false"
  # Go test configuration
  GO_TEST: "false"
  GO_TEST_FLAGS: ""
  GO_JUNIT_REPORT_PATH: "coverage/report.xml"

  # Command used for unit testing, use bash to set initial value ${TEST_SHELL:-"xxx"}
  # TEST_SHELL: ""

# SonarQube scan configuration
# Configure SONAR_URL and SONAR_TOKEN in your GitLab CI/CD variables
.scan_vars:
  SONAR_DIR: "./src"
  SONAR_SCAN_ARGS: ""
  SONAR_MAVEN: "false"
  SONAR_COMMON: "true"
  SONAR_GATE: "false"
  SONAR_BINARIES: 'target/classes'
  SONAR_TEST_BINARIES: 'target/test-classes'
  MIN_COVERAGE: "80"

# Image & build related variables
.build_vars:
  # Cache directory for build artifacts
  CACHE_DIR: "${CI_PROJECT_DIR}/.cache"
  # Package manager for frontend build (pnpm/yarn)
  PACKAGE_MANAGER: "pnpm"
  # Disable frontend cache
  NODE_CACHE_DISABLE: "false"
  # Extra parameters used for NODE build
  NODE_OPTIONS: "--max_old_space_size=4096"
  # Frontend packaging generated static folder, default dist, no need to change
  STATIC_FILE_NAME: ""
  # Jar package name generated after maven packaging, can use gitlab-ci built-in variable ${CI_PROJECT_NAME}, default is app, no need to set
  MAVEN_APP_NAME: "app"
  # Default build maven library
  BUILD_MAVEN_SNAPSHOT: "false"
  # Golang build configuration
  GO_CGO_ENABLED: "0"
  GO_ARCH: "amd64"
  GO_GOPROXY: ""
  GO_GOPRIVATE: ""
  # Docker Hub configuration
  # For Docker Hub (docker.io), DOCKER_HUB_ORGANIZATION specifies your organization/username
  # Default is set to cdryzun for open source use, override as needed
  # Docker Hub only supports single-level organization, so multi-level namespace is flattened:
  #   GitLab path: sre/devops/go-hello → Docker image: docker.io/cdryzun/sre-devops_go-hello
  #   GitLab path: team/backend/api     → Docker image: docker.io/cdryzun/team-backend_api
  # This avoids conflicts when different namespaces have same project names
  DOCKER_HUB_ORGANIZATION: "cdryzun"
  # Docker image name (processed in pre stage)
  # For private registries: ${DOCKER_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}
  # For Docker Hub: ${DOCKER_REGISTRY}/${DOCKER_HUB_ORGANIZATION}/${flat-namespace}_${CI_PROJECT_NAME}
  IMG_NAME: "${DOCKER_REGISTRY}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}"
  # Command for program build
  #BUILD_SHELL: "mvn clean package -Dmaven.test.skip=true"
  #BUILD_SHELL: "mvn clean package"

  # Whether to ignore pnpm lock file dependencies during pnpm install
  PNPM_LOCKFILE_DISABLE: "false"
  # DEV image prefix dev-xxx
  DEV_DOCKER_TAG_PERFIX: "${CI_COMMIT_REF_NAME}"
  # docker daemon build image workspace
  DOCKER_DAEMON_WORKSPACE: './docker-build'
  # Docker image version, use ${CI_COMMIT_REF_NAME} for release version, otherwise use ${DEV_DOCKER_TAG_PERFIX}-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}
  DOCKER_IMAGE_TAG: ""

  # Whether to build release image, default is false, regex will be used for judgment later
  RELEASE_BUILD: "false"
  # Whether to build docker image by default
  DOCKER_IMAGE_BUILD: "true"
  # feat | hotfix | bugfix feature branches whether to build docker image, disabled by default
  FEAT_DOCKER_IMAGE_BUILD: "false"
  # Extra parameters added during docker build, such as "--no-cache" to build without cache, multiple parameters separated by space
  DOCKER_BUILD_FLAGS: '--no-cache'
  # Specify custom nginx config to use, default is docker/nginx.conf in project
  CUSTOM_NGINX_CONF: "docker/nginx.conf"
  # Specify custom Dockerfile path for current project, supports relative or absolute path, leave empty to use default template
  CUSTOM_DOCKERFILE_PATH: ""
  # Whether to use custom Dockerfile (auto-detected by pre stage, usually no need to configure manually)
  CUSTOM_DOCKERFILE: ""
  # Docker build workspace preparation command, executed in DOCKER_DAEMON_WORKSPACE directory
  # Used to prepare dependency config files needed for Dockerfile build (e.g., nginx.conf, config.json, etc.)
  # Example: "cp ${CI_PROJECT_DIR}/config/nginx.conf . && cp ${CI_PROJECT_DIR}/config/app.conf ."
  DOCKER_WORKSPACE_PREPARE_CMD: ""
  # Default maven project, POM file used for output results
  BUILD_MAVEN_POM_FILE: "pom.xml"
  # Maximum number of auto-created Tags retained in prd ci, default 20
  PRD_CD_CREATE_TAG_NUM: "20"
  # RELASE Create notes message
  PRD_CD_CREATE_TAG_MESSAGE: "notes message by gitlab-ci pipeline in change-manifests task"
  # Whether to auto create Tag when running prd branch pipeline, default is true
  PRD_BUILD_CREATE_TAG: "true"
  # Whether to enable scaffold project build, this switch is for JAVA projects
  RELEASE_LIB_BUILD: "false"
  # Whether to build snapshots version for scaffold project
  SNAPSHOTS_LIB_BUILD: "true"
  # Enable Docker buildkit, built-in variable, do not modify
  DOCKER_BUILDKIT: 1

# CD deployment environment variables
.cd_vars:
  # Whether to disable retag in tag image build stage, choose to rebuild instead
  RELEASE_RETAG_DISABLE: "false"
  # Name used in auto commit
  GIT_AUTO_COMMIT_NAME: "ci-bot"
  # Email used in auto commit
  GIT_AUTO_COMMIT_EMAIL: "ci-bot@example.com"
  # Image name used in CD deployment stage, will replace "${DEV_DOCKER_TAG_PERFIX}-${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}" default version when set
  CD_DEPLOY_IMGAGE: ""
  # Default commit push remote branch
  REMOTE_BRANCH: "dev"
  # Optional custom target branch mapping (preferred names)
  CUSTOM_REMOTE_SIT_BRANCH: ""
  CUSTOM_REMOTE_PRD_BRANCH: ""
  # Backward-compatible aliases (legacy typo)
  CUSTOME_REMOTE_SIT_BRANCH: ""
  CUSTOME_REMOTE_PRD_BRANCH: ""
  # ci auto commit message to charts repository, can use built-in "variables"
  DEPLOY_COMMIT_MESSAGE: "helm values updated by gitlab-ci pipeline in change-manifests task. Trigger by ${GITLAB_USER_NAME}"
  ROLLBACK_COMMIT_MESSAGE: "helm values rollback by gitlab-ci pipeline in change-manifests task. Trigger by ${GITLAB_USER_NAME}"
  # Which field in yaml will the generated tag replace
  DEPLOY_REPO_YAML_TAG: ".image.tag"
  # Which file to specify for tag replacement
  DEPLOY_VALUE_FILE: "values.yaml"
  # Current associated folder directory in cd deployment stage, default is current CI_PROJECT_NAME
  DEPLOY_REPO_PROJ: ""
  # Variable collection file needed for cd rollback
  CD_ENV_FILE: "cd.env"
  # feat feature branch, CD auto deploy to corresponding Charts repository, depends on variable DEPLOY_REPO, default off
  FEAT_CD_AUTO_DEPLOY: "false"
  # dev, sit, prd environment, CD auto deploy to corresponding Charts repository, depends on variable DEPLOY_REPO, default on
  DEV_CD_AUTO_DEPLOY: "true"
  SIT_CD_AUTO_DEPLOY: "true"
  PRD_CD_AUTO_DEPLOY: "true"
  # prd branch, whether to auto create branch when running pipeline, default on
  PRD_CD_CREATE_TAG: "true"
  DOCKERFILE_BUILD_JDK_VERSION: "jdk17"

# Default image list - Using GitHub Container Registry public images
.default_image_vars:
  # Base build image used in pipeline build stage, will auto-select corresponding image based on project type
  # To override build image for specific project type, set this variable directly
  BASE_BUILD_IMAGE: ""
  MAVEN_IMAGE: "ghcr.io/cdryzun/glci-builder-java:jdk17"
  GRADLE_IMAGE: "ghcr.io/cdryzun/glci-builder-java:jdk17"
  NODE_IMAGE: "ghcr.io/cdryzun/glci-builder-nodejs:20"
  SONAR_IMAGE: "ghcr.io/cdryzun/glci-builder-java:jdk17"
  TOOLBOX_IMAGE: "ghcr.io/cdryzun/glci-toolbox:latest"
  PYTHON_IMAGE: "ghcr.io/cdryzun/glci-builder-python:3.11"
  GO_IMAGE: "ghcr.io/cdryzun/glci-builder-golang:1.23"
  CD_DEPLOY_IMAGE: "${TOOLBOX_IMAGE}"
  TEST_IMAGE: "${TOOLBOX_IMAGE}"

# Repository URL variables - Configure these in your GitLab CI/CD variables for internal use
.repo_list_vars:
  # Docker registry (default: docker.io)
  DOCKER_REGISTRY: "docker.io"
  # Node.js registry (Chinese mirror for faster downloads)
  NODE_REGISTRY: "https://registry.npmmirror.com"
  # Python package index (default: PyPI)
  PYPI: "https://pypi.org/simple"
  # Maven central repository
  MAVEN_REGISTRY: "https://repo1.maven.org/maven2/"
  # Optional: Override above with your internal registry by setting these in GitLab CI/CD variables
  # HARBOR_URL: "harbor.example.com"
  # NEXUS_URL: "https://nexus.example.com"
  # PYPI_PRIVATE: "https://nexus.example.com/repository/pypi-local/"

# Tools are pre-installed in the glci-toolbox image
# No need to download them during CI pipeline
.tools_download_vars:
  TEMPLATE_REPO_RAW_URL: "https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/${TEMPLATE_BRANCH_NAME}"

# Vault configuration (optional)
# Configure VAULT_SERVER_URL, VAULT_AUTH_ROLE in your GitLab CI/CD variables
.vault_vars:
  VAULT_AUTH_ROLE: "ci-vault"
  VAULT_AUTH_PATH: "jwt"
  # Optional: Credentials for internal services (configure in GitLab CI/CD variables)
  LDAP_USER: "${NEXUS_USER:-}"
  LDAP_PASSWD: "${NEXUS_PASSWORD:-}"
  HARBOR_USER: "${REGISTRY_USER:-}"
  HARBOR_PASSWD: "${REGISTRY_PASSWORD:-}"
  SONAR_TOKEN: "${SONARQUBE_TOKEN:-}"
  GITLAB_READ_TOKEN: "${GITLAB_TOKEN:-}"
  GITLAB_REPO_COMMIT_TOKEN: "${GITLAB_TOKEN:-}"
  GITLAB_API_TOKEN: "${GITLAB_TOKEN:-}"

# Artifacts default configuration
.default_artifacts:
  artifacts:
    expire_in: 14 days

# Docker image scan related variables
.image_scan:
  # Scan image security vulnerabilities
  DOCKER_IMAGE_SCAN_IMAGE: "false"
  # Whether to force CI interruption if image vulnerability level is medium-high or above
  ENFORCE_EXIT: "false"
  # GitLab container scan variables
  CS_ANALYZER_IMAGE: "docker.io/aquasec/trivy:latest"
  IMAGE_NAME: "$IMG_NAME"
  CI_REGISTRY_IMAGE: "$IMAGE_NAME"