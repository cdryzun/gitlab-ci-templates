# ============================================
# Multi-Architecture Build Variables
# Multi-architecture build configuration variables
# ============================================

.multiarch_vars:
  variables:
    # ========================================
    # Multi-architecture build master switch
    # ========================================
    # Whether to enable multi-architecture build
    # true: Enable Docker Buildx multi-architecture build
    # false: Use traditional single-architecture build (default)
    MULTIARCH_BUILD_ENABLE: "false"

    # ========================================
    # Target platform configuration
    # ========================================
    # List of target platforms for build (comma-separated)
    # Common platforms:
    #   - linux/amd64       (x86_64, Intel/AMD processors)
    #   - linux/arm64       (aarch64, ARM 64-bit, e.g., AWS Graviton, Alibaba Cloud)
    #   - linux/arm/v7      (armv7, ARM 32-bit)
    #   - linux/arm/v6      (armv6, Raspberry Pi, etc.)
    #   - linux/386         (x86 32-bit)
    #   - linux/ppc64le     (PowerPC 64-bit)
    #   - linux/s390x       (IBM Z mainframe)
    DOCKER_BUILD_PLATFORMS: "linux/amd64,linux/arm64"

    # ========================================
    # Buildx Builder configuration
    # ========================================
    # Builder instance name
    BUILDX_BUILDER_NAME: "multiarch-builder"

    # Builder driver type
    # Options:
    #   - docker-container (Recommended, supports all platforms)
    #   - kubernetes (K8s environment)
    #   - docker (Local Docker, limited functionality)
    BUILDX_DRIVER: "docker-container"

    # ========================================
    # Golang multi-architecture build mode
    # ========================================
    # Multi-architecture build mode
    # Options:
    #   - dockerfile   (Recommended) Compile multi-architecture binaries in Dockerfile
    #   - precompile    Pre-compile binaries for multiple architectures, then build image
    GOLANG_MULTIARCH_MODE: "dockerfile"

    # ========================================
    # Build cache configuration
    # ========================================
    # Whether to enable build cache (speed up subsequent builds)
    # true: Use Registry cache
    # false: No cache
    BUILDX_CACHE_ENABLE: "false"

    # ========================================
    # Image push configuration
    # ========================================
    # Whether to push image to Registry
    # true: Auto push after build completes
    # false: Local build only (for testing)
    DOCKER_IMAGE_PUSH: "true"

    # ========================================
    # Golang compilation configuration (multi-architecture)
    # ========================================
    # Go version (for Dockerfile build)
    GO_VERSION: "1.23"

    # Whether to enable CGO
    # 0: Disable CGO (Recommended, pure static compilation)
    # 1: Enable CGO (requires cross-compilation toolchain)
    GO_CGO_ENABLED: "0"

    # Go compiler linker flags
    # -s: Strip symbol table
    # -w: Strip DWARF debug info
    # Purpose: Reduce binary file size
    GO_BUILD_LDFLAGS: "-s -w"

    # ========================================
    # Application runtime configuration
    # ========================================
    # Application listening port
    APP_PORT: "2025"

    # Application name (defaults to project name)
    APP_NAME: "${CI_PROJECT_NAME}"

# ============================================
# Preset configuration templates (quick enable)
# ============================================

# Preset 1: AMD64 only (default, backward compatible)
.multiarch_amd64_only:
  extends: .multiarch_vars
  variables:
    MULTIARCH_BUILD_ENABLE: "false"
    DOCKER_BUILD_PLATFORMS: "linux/amd64"

# Preset 2: AMD64 + ARM64 (Recommended, covers 90% scenarios)
.multiarch_common:
  extends: .multiarch_vars
  variables:
    MULTIARCH_BUILD_ENABLE: "true"
    DOCKER_BUILD_PLATFORMS: "linux/amd64,linux/arm64"
    GOLANG_MULTIARCH_MODE: "dockerfile"

# Preset 3: Full platform support (includes ARM v7)
.multiarch_full:
  extends: .multiarch_vars
  variables:
    MULTIARCH_BUILD_ENABLE: "true"
    DOCKER_BUILD_PLATFORMS: "linux/amd64,linux/arm64,linux/arm/v7"
    GOLANG_MULTIARCH_MODE: "dockerfile"

# Preset 4: ARM64 only (cloud-native ARM servers)
.multiarch_arm64_only:
  extends: .multiarch_vars
  variables:
    MULTIARCH_BUILD_ENABLE: "true"
    DOCKER_BUILD_PLATFORMS: "linux/arm64"
    GOLANG_MULTIARCH_MODE: "dockerfile"

# Preset 5: High performance mode (precompile + cache)
.multiarch_performance:
  extends: .multiarch_vars
  variables:
    MULTIARCH_BUILD_ENABLE: "true"
    DOCKER_BUILD_PLATFORMS: "linux/amd64,linux/arm64"
    GOLANG_MULTIARCH_MODE: "precompile"
    BUILDX_CACHE_ENABLE: "true"
