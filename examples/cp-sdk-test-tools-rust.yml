include:
  - project: "devops/ci-templates"
    ref: main
    file: "/utils/manage.stable.gitlab-ci.yml"

stages:
  - build

variables:
  RUNNER: ${RUNNER:-"arm64"}
  PROJECT_NAME: "cp-sdk-test-tools-rust"
  SIGN_TOOLS_VERSION: "0.0.2"
  IMAGE_NAME: "harbor.cpinnov.run/library/base-image:rust-build"
  API_BASE: "https://getsdk-dev.cpinnov.run/api/v1"
  NEXUS_BROWSER_BASE: "https://nexus.cpinnov.run/service/rest/repository/browse/static-public/cp-sdk-test-tools-rust"
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  CPSDK_USE_BINDGEN: "1"
  NEXUS_BASE_URL: "https://nexus.cpinnov.run/repository"
  NEXUS_REPO_NAME: "linux-apps"
  NEXUS_PROJECT_PATH: "cp-sdk-test-tools-rust"
  # script_download 函数所需变量 (GITLAB_READ_TOKEN 需在 CI/CD Settings 中配置)
  TEMPLATE_REPO: "https://gitlab.cpinnov.run/devops/ci-templates"
  TEMPLATE_REPO_PROJECT_ID: "${TEMPLATE_REPO_PROJECT_ID:-2}" # ci-templates 项目 ID，需根据实际情况配置
  TEMPLATE_BRANCH_NAME: "devops"

.download_deps_template: &download_deps
  - |
    echo "Downloading CP SDK dependencies..."
    if [ ! -f "shell/download-deps.sh" ]; then
      echo "shell/download-deps.sh not found, downloading from remote..."
      script_download rust-cpsdk-get.sh shell/download-deps.sh
    else
      echo "Using existing shell/download-deps.sh"
    fi
    chmod +x shell/download-deps.sh
    printenv | grep 'CPSDK_' || true
    export TARGET_ARCH=aarch64
    export TARGET_OS=linux
    "./shell/download-deps.sh"
    echo "Dependencies downloaded:"
    jq . "DEPENDENCIES.json"

.build_template: &build_common
  stage: build
  retry: 2
  image: ${IMAGE_NAME}
  tags:
    - ${RUNNER}
  before_script:
    - !reference [.utils_shell_function, script]
    - |
      # echo "Installing cross and dependencies..."
      # apt-get update && apt-get install -y jq curl
      if ! command -v zip >/dev/null 2>&1; then
        echo "zip not found, installing..."
        apt-get update && apt-get install -y zip
      fi
      export PATH="${CARGO_HOME}/bin:${RUSTUP_HOME}/bin:${PATH}"
      if ! command -v cargo >/dev/null 2>&1; then
        echo "cargo not found in PATH: ${PATH}"
        exit 1
      fi
      cargo --version

      # Install cross tool from GitHub
      if ! command -v cross &> /dev/null; then
        echo "Installing cross from GitHub..."
        cargo install cross --git https://github.com/cross-rs/cross
      fi
      docker --version
      docker info
      if [ ! -S /var/run/docker.sock ]; then
        echo "Docker socket not mounted at /var/run/docker.sock"
        exit 1
      fi

      cross --version
    - *download_deps
  after_script:
    - |
      if [ -f "DEPENDENCIES.json" ]; then
        echo "Final DEPENDENCIES.json:"
        jq . "DEPENDENCIES.json"
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(.\d+)?(-{1}([a-zA-Z0-9._-]{2,60}))?$/ || $CI_COMMIT_TAG =~ /^v\d+.\d+\.\d+(.\d+)?(-{1}([a-zA-Z0-9._-]{2,60}))?$/'
      variables:
        RELEASE_BUILD: "true"
    - if: "$CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH"
      variables:
        DEFAULT_BRANCH: "true"
    - if: '$CI_COMMIT_REF_NAME == "develop" || $CI_COMMIT_REF_NAME == "dev"'
      variables:
        DEV_BRANCH: "true"
    - if:
        '$CI_COMMIT_REF_NAME =~ /^(feat|bugfix|hotfix|plan|release)((-){1}[\._0-9a-zA-Z]{1,12})?(\/{1}[A-Za-z0-9-_\.]{2,60})?$/
        && ($CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000" || $CI_PIPELINE_SOURCE == "web" || ($CI_PIPELINE_SOURCE == "api" && $AUTO_BUILD == "true"))'
      variables:
        FEAT_BRANCH: "true"

build:aarch64:
  <<: *build_common
  parallel:
    matrix:
      - CPSDK_LINK_MODE: "dynamic"
        ARTIFACT_MODE: "dynamic-app"
        BUNDLE_SDK_LIBS: "1"
      - CPSDK_LINK_MODE: "static"
        CPSDK_NATIVE_LINK_MODE: "dynamic"
        ARTIFACT_MODE: "static-hybrid"
        BUNDLE_SDK_LIBS: "1"
      - CPSDK_LINK_MODE: "system"
        ARTIFACT_MODE: "dynamic-system"
        BUNDLE_SDK_LIBS: "0"
  script:
    - |
      #!/bin/bash
      set -eou pipefail

      BUILD_DATE=$(date +%Y%m%d%H%M)
      export BUILD_DATE

      echo "Building with ${CPSDK_LINK_MODE} linking using cross..."
      cross build --target aarch64-unknown-linux-gnu --release

      DEPS_HASH=$(jq -r '.dependencies | map(.version) | join("-")' "DEPENDENCIES.json" | sha256sum | cut -c1-8)
      echo "DEPS_HASH=${DEPS_HASH}" > "build.env"
      DEPS_TAG=$(jq -r '.dependencies | map(.module + "-" + .version) | join("_")' "DEPENDENCIES.json")

      DIST_DIR="dist"
      ARTIFACT_DIR="artifact"
      rm -rf "${DIST_DIR}" "${ARTIFACT_DIR}"
      mkdir -p "${DIST_DIR}" "${ARTIFACT_DIR}"
      cp "target/aarch64-unknown-linux-gnu/release/app" "${DIST_DIR}/"
      cp "DEPENDENCIES.json" "${DIST_DIR}/"
      cp "build.env" "${DIST_DIR}/"
      if [ "${BUNDLE_SDK_LIBS}" = "1" ]; then
        shopt -s nullglob
        libs=(crates/cp_*/libs/linux-aarch64/version/*.so*)
        shopt -u nullglob
        if [ ${#libs[@]} -eq 0 ]; then
          echo "No SDK .so files found to bundle" >&2
          exit 1
        fi
        cp -f "${libs[@]}" "${DIST_DIR}/"
      fi

      ZIP_NAME="cp-sdk-test-tools-${CI_COMMIT_SHORT_SHA}-${ARTIFACT_MODE}-${DEPS_TAG}.zip"
      (cd "${DIST_DIR}" && zip -r "../${ARTIFACT_DIR}/${ZIP_NAME}" .)

      cp "DEPENDENCIES.json" "${ARTIFACT_DIR}/"
      cp "build.env" "${ARTIFACT_DIR}/"

      echo ""
      echo "=========================================="
      echo "Artifact Collection Summary"
      echo "=========================================="
      echo "Commit SHA:       ${CI_COMMIT_SHORT_SHA}"
      echo "Build Type:       ${ARTIFACT_MODE}"
      echo "Artifact Path:    ${ARTIFACT_DIR}/${ZIP_NAME}"
      echo "Dependencies:     ${ARTIFACT_DIR}/DEPENDENCIES.json"
      echo "Build Metadata:   ${ARTIFACT_DIR}/build.env"
      printf '\033[36mBrowser URL:      %s\033[0m\n' "${NEXUS_BROWSER_BASE%/}/${DEPS_HASH}/${CI_COMMIT_SHORT_SHA}/"
      echo "=========================================="
      echo ""

      if [ -n "${NEXUS_USER:-}" ] && [ -n "${NEXUS_PASSWORD:-}" ]; then
        OUTPUT_PATH="${ARTIFACT_DIR}"
        NEXUS_REPO_URL="${NEXUS_BASE_URL}/${NEXUS_REPO_NAME}"
        # Allow override via NEXUS_PATH_PREFIX environment variable
        NEXUS_PATH="${NEXUS_PATH_PREFIX:-${NEXUS_PROJECT_PATH}/${DEPS_HASH}/${CI_COMMIT_SHORT_SHA}}"
        NEXUS_FULL_URL="${NEXUS_REPO_URL}/${NEXUS_PATH}"

        echo ""
        echo "=========================================="
        echo "Uploading Artifacts to Nexus"
        echo "=========================================="
        echo "Repository: ${NEXUS_REPO_URL}"
        echo "Path:       ${NEXUS_PATH}"
        echo "Full URL:   ${NEXUS_FULL_URL}"
        echo "=========================================="
        echo ""

        UPLOAD_SUCCESS=0
        UPLOAD_FAILED=0

        while IFS= read -r -d '' file; do
          filename="${file#"${OUTPUT_PATH}/"}"
          filesize=$(du -h "${file}" | cut -f1)
          printf "  [Upload] %-60s %8s ... " "${filename}" "${filesize}"

          upload_url="${NEXUS_FULL_URL}/${filename}"

          # Use curl with progress suppressed but errors shown
          upload_output=$(curl -w "\n%{http_code}" \
            -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
            --upload-file "${file}" \
            -s -S \
            "${upload_url}" 2>&1)

          http_code=$(echo "${upload_output}" | tail -n1)

          if [ "${http_code}" = "201" ] || [ "${http_code}" = "200" ]; then
            echo "OK"
      ((++UPLOAD_SUCCESS))
          else
            echo "FAILED (HTTP ${http_code})"
            # Show error details if available
            error_msg=$(echo "${upload_output}" | head -n-1)
            if [ -n "${error_msg}" ]; then
              echo "         Error: ${error_msg}"
            fi
      ((++UPLOAD_FAILED))
          fi
        done < <(find "${OUTPUT_PATH}" -type f ! -name ".DS_Store" -print0)

        echo ""
        echo "=========================================="
        echo "Upload Summary"
        echo "=========================================="
        echo "Success: ${UPLOAD_SUCCESS} files"
        echo "Failed:  ${UPLOAD_FAILED} files"
        echo ""
        echo "Download URL:"
        echo "${NEXUS_FULL_URL}/"
        echo "=========================================="
        echo ""
      else
        echo "NEXUS_USER or NEXUS_PASSWORD not set, skipping Nexus upload"
      fi

      # 发送钉钉通知
      if [ "${ARTIFACT_MODE}" = "dynamic-app" ]; then
        echo "发送钉钉通知..."
        BUILD_VERSION=$(jq -r '.dependencies | map("-" + .version) | join("_")' "DEPENDENCIES.json")
        if command -v singtools >/dev/null 2>&1; then
          singtools dingtalk --type app \
            --name "${PROJECT_NAME}" \
            --url "${NEXUS_BROWSER_BASE%/}/${DEPS_HASH}/${CI_COMMIT_SHORT_SHA}/" \
            --notification_type APP \
            --ota_url "${BUILD_VERSION}" || echo "钉钉通知发送失败（可忽略）"
        else
          echo "singtools 未安装，尝试安装..."
          if [ -z "${SIGN_TOOLS_VERSION:-}" ]; then
            echo "SIGN_TOOLS_VERSION 未设置，跳过钉钉通知"
          else
            curl -fsSL "https://nexus.cpinnov.run/repository/static-public/tools/singtools/singtools_${SIGN_TOOLS_VERSION}_linux_amd64.tar.gz" \
              -o "singtools_${SIGN_TOOLS_VERSION}_linux_amd64.tar.gz"
            tar -zxvf "singtools_${SIGN_TOOLS_VERSION}_linux_amd64.tar.gz" -C "/usr/local/bin"
            rm -rf "singtools_${SIGN_TOOLS_VERSION}_linux_amd64.tar.gz"
            chmod a+x "/usr/local/bin/singtools"
            echo "singtools install success"
            singtools dingtalk --type app \
              --name "${PROJECT_NAME}" \
              --url "${NEXUS_BROWSER_BASE%/}/${DEPS_HASH}/${CI_COMMIT_SHORT_SHA}/" \
              --notification_type APP \
              --ota_url "${BUILD_VERSION}" || echo "钉钉通知发送失败（可忽略）"
          fi
        fi
      fi
