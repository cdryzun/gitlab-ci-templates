# ============================================
# 你的项目：多架构预编译模式配置示例
# 使用你的 build-ci.sh 脚本预编译多个架构的二进制
# ============================================

include:
  - project: 'devops/ci-templates'
    ref: devops
    file: 'jobs-templates/Auto-DevOps.gitlab-ci.yml'

variables:
  # ========== 现有配置（保持不变）==========
  CGO_ENABLED: "0"
  BUILD_SHELL: "bash build-ci.sh"  # 保持你的构建脚本
  UNIT_TEST_ENABLE: "false"
  DOCKER_IMAGE_SCAN_IMAGE: "false"
  DEV_CD_AUTO_DEPLOY: "true"
  SIT_CD_AUTO_DEPLOY: "true"
  PRD_BUILD_CREATE_TAG: "true"
  FEAT_DOCKER_IMAGE_BUILD: "true"
  FEAT_CD_AUTO_DEPLOY: "true"
  BASE_BUILD_IMAGE: "harbor.cpinnov.run/library/base-image:golang1.25.0-nodejs24-rk-debian-amd64"

  # ========== 多架构预编译配置（新增 3 行）==========
  MULTIARCH_BUILD_ENABLE: "true"
  DOCKER_BUILD_PLATFORMS: "linux/amd64,linux/arm64"
  GOLANG_MULTIARCH_MODE: "precompile"  # ✨ 使用预编译模式

# ============================================
# 工作原理说明
# ============================================

# 1. CI 阶段会自动为每个架构执行你的 build-ci.sh：
#    - GOOS=linux GOARCH=amd64 bash build-ci.sh
#    - GOOS=linux GOARCH=arm64 bash build-ci.sh
#
# 2. 生成的二进制文件会被重命名为：
#    - ${CI_PROJECT_NAME}-linux-amd64
#    - ${CI_PROJECT_NAME}-linux-arm64
#
# 3. Docker 构建时，根据 TARGETARCH 选择对应的二进制文件

# ============================================
# build-ci.sh 需要做的调整（可选）
# ============================================

# 你的 build-ci.sh 可以检测并使用这些环境变量：
#
# - GOOS: 目标操作系统（linux）
# - GOARCH: 目标架构（amd64, arm64）
# - OUTPUT_NAME: 建议的输出文件名（${CI_PROJECT_NAME}-linux-amd64）
# - TARGET_OS: 同 GOOS（可选）
# - TARGET_ARCH: 同 GOARCH（可选）
#
# 示例修改（在 build-ci.sh 中）：
#
# #!/bin/bash
# # build-ci.sh
#
# # 获取目标架构（兼容现有逻辑）
# TARGET_OS="${GOOS:-linux}"
# TARGET_ARCH="${GOARCH:-amd64}"
# OUTPUT_FILE="${OUTPUT_NAME:-${CI_PROJECT_NAME}}"
#
# # 版本信息注入（保持现有逻辑）
# VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
# COMMIT="${CI_COMMIT_SHA}"
# BUILD_DATE="$(date +%Y-%m-%d/%H:%M)"
# GO_VERSION=$(go version | awk '{print $3}')
#
# # 编译（使用环境变量）
# GOOS=${TARGET_OS} GOARCH=${TARGET_ARCH} CGO_ENABLED=${CGO_ENABLED:-0} \
# go build \
#   -ldflags="-s -w \
#     -X 'main.Version=${VERSION}' \
#     -X 'main.Commit=${COMMIT}' \
#     -X 'main.BuildDate=${BUILD_DATE}' \
#     -X 'main.GoVersion=${GO_VERSION}'" \
#   -o "${OUTPUT_FILE}" \
#   ./
#
# echo "Built ${OUTPUT_FILE} for ${TARGET_OS}/${TARGET_ARCH}"

# ============================================
# 如果不想修改 build-ci.sh
# ============================================

# 方案 1：保持原样，脚本会自动处理
# - build-ci.sh 输出 ${CI_PROJECT_NAME}
# - 脚本自动重命名为 ${CI_PROJECT_NAME}-linux-amd64
# - 无需任何修改

# 方案 2：使用自定义 Dockerfile
# variables:
#   CUSTOM_DOCKERFILE_PATH: "docker/Dockerfile.precompile"
#
# 创建 docker/Dockerfile.precompile：
#
# FROM alpine:3.22
# ARG TARGETARCH
# ARG CI_PROJECT_NAME
# COPY ./binaries/${CI_PROJECT_NAME}-linux-${TARGETARCH} /app/app
# RUN chmod +x /app/app
# CMD ["/app/app"]

# ============================================
# 验证多架构镜像
# ============================================

# 构建完成后，在日志中查看：
#
# [信息]: 多架构构建已启用
# [信息]: 使用预编译模式
# [信息]: 编译 linux/amd64 架构...
# [提示]: 使用自定义构建脚本: bash build-ci.sh
# [提示]: 目标平台: linux/amd64
# [信息]: 编译完成: your-project-linux-amd64
# [提示]: 文件信息: ELF 64-bit LSB executable, x86-64
# [提示]: 文件大小: 15M
#
# [信息]: 编译 linux/arm64 架构...
# [提示]: 使用自定义构建脚本: bash build-ci.sh
# [提示]: 目标平台: linux/arm64
# [信息]: 编译完成: your-project-linux-arm64
# [提示]: 文件信息: ELF 64-bit LSB executable, ARM aarch64
# [提示]: 文件大小: 15M
#
# [信息]: 所有编译的二进制文件:
# -rwxr-xr-x 1 root root 15M your-project-linux-amd64
# -rwxr-xr-x 1 root root 15M your-project-linux-arm64

# 在本地验证：
# docker buildx imagetools inspect ${HARBOR_URL}/${NAMESPACE}/${PROJECT}:${TAG}
#
# 输出：
# Manifests:
#   Platform: linux/amd64
#   Platform: linux/arm64
