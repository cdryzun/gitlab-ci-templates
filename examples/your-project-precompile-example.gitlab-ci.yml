# ============================================
# Your Project: Multi-architecture Precompile Mode Configuration Example
# Use your build-ci.sh script to precompile binaries for multiple architectures
# ============================================

include:
  - remote: 'https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/open/jobs-templates/Auto-DevOps.latest.gitlab-ci.yml'

variables:
  # ========== Existing Configuration (Keep Unchanged) ==========
  CGO_ENABLED: "0"
  BUILD_SHELL: "bash build-ci.sh"  # Keep your build script
  UNIT_TEST_ENABLE: "false"
  DOCKER_IMAGE_SCAN_IMAGE: "false"
  DEV_CD_AUTO_DEPLOY: "true"
  SIT_CD_AUTO_DEPLOY: "true"
  PRD_BUILD_CREATE_TAG: "true"
  FEAT_DOCKER_IMAGE_BUILD: "true"
  FEAT_CD_AUTO_DEPLOY: "true"
  BASE_BUILD_IMAGE: "docker.io/cdryzun/glci-builder-golang:1.23"

  # ========== Multi-architecture Precompile Configuration (Add 3 lines) ==========
  MULTIARCH_BUILD_ENABLE: "true"
  DOCKER_BUILD_PLATFORMS: "linux/amd64,linux/arm64"
  GOLANG_MULTIARCH_MODE: "precompile"  # Use precompile mode

# ============================================
# How It Works
# ============================================
# 1. Build stage executes your build-ci.sh to compile binaries for each architecture
# 2. Dockerfile packages using the precompiled binaries
# 3. Final multi-architecture image is generated and pushed to Docker Hub
# ============================================
