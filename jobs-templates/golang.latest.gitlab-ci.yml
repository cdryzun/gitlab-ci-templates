include:
  - local: "vars/*.latest.gitlab-ci.yml"
  - local: "utils/*.latest.gitlab-ci.yml"
  - local: "jobs-templates/SonarQube.latest.gitlab-ci.yml" # SonarQube code scan

variables:
  extends: .default_vars

default:
  image: ${GO_IMAGE}

stages:
  !reference [ .general_stage, stages ]

test:
  extends:
    - .go_test
    - .unit_test_base

build:
  extends:
    - .go_build
    - .build_base

scan:
  extends:
    - .image_scan_base

deploy:
  extends:
    - .image_deploy_base

workflow:
  rules:
    !reference [ .trigger_rule, rules ]

