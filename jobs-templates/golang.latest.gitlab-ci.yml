include:
  - local: "vars/*.stable.gitlab-ci.yml"
  - local: "utils/*.stable.gitlab-ci.yml"
  - local: "jobs-templates/SonarQube.gitlab-ci.yml" # SonarQube code scan

variables:
  extends: .default_vars
  # CACHE_DIR will be dynamically set in pre stage for golang projects
  # GOPATH will be set to ${CI_PROJECT_DIR}/.go for cache compatibility

default:
  image: ${GO_IMAGE}

cache:
  paths:
    - ${CACHE_DIR}

stages:
  !reference [ .general_stage, stages ]

test:
  extends:
    - .go_test
    - .unit_test_base

build:
  extends:
    - .go_build
    - .build_base

scan:
  extends:
    - .image_scan_base

deploy:
  extends:
    - .image_deploy_base

workflow:
  rules:
    !reference [ .trigger_rule, rules ]

