include:
  - local: "vars/*.stable.gitlab-ci.yml"
  - local: "utils/*.stable.gitlab-ci.yml"
  - local: "jobs-templates/SonarQube.gitlab-ci.yml" # SonarQube code scan

variables:
  extends: .default_vars
  # Override CACHE_DIR for golang projects
  # Golang uses GOPATH for module caching, not project-level .cache directory
  CACHE_DIR: ""

default:
  image: ${GO_IMAGE}

cache:
  paths:
    # Cache Go modules to speed up dependency downloads
    - /go/pkg/mod

stages:
  !reference [ .general_stage, stages ]

test:
  extends:
    - .go_test
    - .unit_test_base

build:
  extends:
    - .go_build
    - .build_base

scan:
  extends:
    - .image_scan_base

deploy:
  extends:
    - .image_deploy_base

workflow:
  rules:
    !reference [ .trigger_rule, rules ]

