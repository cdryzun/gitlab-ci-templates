
# Common rules for SonarQube scanning
.common_sonar_rules:
  rules:
    # Skip if SONAR_URL is not configured
    - if: '$SONAR_URL == null || $SONAR_URL == ""'
      when: never
    # Skip if SONAR_COMMON is disabled
    - if: '$SONAR_COMMON != "true"'
      when: never
    # Production branches with quality gate
    - if: '$CI_COMMIT_REF_NAME =~ /^(dev|master|develop|release|sit|prd)((-|_)[-_0-9a-z]{1,12})?$/'
      variables:
        SONAR_GATE: "true"
    # Feature branches without quality gate
    - if: '$CI_COMMIT_REF_NAME =~ /^(feat|fix|hotfix|bugfix)((-|_)[-_0-9a-z]{1,12})?$/'
      variables:
        SONAR_GATE: "false"
    # Release tags
    - if: '$CI_COMMIT_REF_NAME =~ /^v?\d+\.\d+\.\d+((\-[a-zA-Z0-9]+)+)?$/'
      variables:
        SONAR_GATE: "true"
    # Default: don't run
    - when: never

sonar:
  stage: sonar
  image: ${SONAR_IMAGE}
  extends:
    - .runner_tag
    - .sonar_before_jobs
    - .gitlab_auth_vars
    - .sonar_auth_vars
    - .nexus_auth
    - .sonar_auth
    - .load_artifacts_env
    - .clean_auth_files
  allow_failure: true
  script:
    - !reference [ .sonar_check, script ]
    - |
      script_download _utils.${TEMPLATE_CONTEXT}.sh _utils.sh
      script_download sonarqube.${TEMPLATE_CONTEXT}.sh
      chmod +x ./run.sh
      shell_exec './run.sh'
  rules:
    !reference [ .common_sonar_rules, rules ]
