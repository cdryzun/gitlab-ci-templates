include:
  - local: "vars/*.stable.gitlab-ci.yml"
  - local: "utils/*.stable.gitlab-ci.yml"
  - local: "jobs-templates/SonarQube.gitlab-ci.yml" # sonaruqbe 代码扫描

variables:
  extends: .default_vars

default:
  image: ${MAVEN_IMAGE}

cache:
  paths:
    - ${CACHE_DIR}

stages:
  !reference [ .general_stage, stages ]

test:
  extends:
    - .maven_test
    - .unit_test_base

build:
  extends:
    - .maven_build
    - .build_base

scan:
  extends:
    - .image_scan_base

deploy:
  extends:
    - .image_deploy_base

workflow:
  rules:
    !reference [ .trigger_rule, rules ]