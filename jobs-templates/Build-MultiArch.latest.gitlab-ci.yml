# ============================================
# Multi-Architecture Build Job Template
# ============================================

include:
  - local: 'vars/multiarch-vars.latest.gitlab-ci.yml'

# ============================================
# Buildx Pre-job Preparation Task
# ============================================

.buildx_before_script:
  before_script:
    # 1. Harbor authentication (inherit existing logic)
    - echo "${HARBOR_PASSWD}" | docker login ${HARBOR_URL} -u ${HARBOR_USER} --password-stdin

    # 2. Check Docker version
    - docker version
    - docker buildx version

    # 3. Enable QEMU (support cross-architecture emulation)
    - |
      if [ "${MULTIARCH_BUILD_ENABLE}" == "true" ]; then
        echo "[INFO] Setting up QEMU for cross-platform emulation..."
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      fi

    # 4. Display system information
    - |
      if [ "${CI_DEBUG_TRACE}" == "true" ]; then
        echo "=== System Info ==="
        uname -a
        docker buildx ls
        docker info
      fi

# ============================================
# Multi-Architecture Build Task
# ============================================

build-multiarch:
  stage: build
  extends:
    - .runner_tag
    - .nexus_auth
    - .harbor_auth
    - .buildx_before_script  # Use Buildx pre-job script
  variables:
    # Enable multi-architecture build (can be overridden in project)
    MULTIARCH_BUILD_ENABLE: "true"

  script:
    # 1. Download scripts
    - script_download _utils.${TEMPLATE_CONTEXT}.sh
    - script_download build-multiarch.${TEMPLATE_CONTEXT}.sh

    # 2. Create Docker workspace
    - mkdir -p ${DOCKER_DAEMON_WORKSPACE}

    # 3. Process Dockerfile
    - |
      if [ -n "${CUSTOM_DOCKERFILE_PATH}" ]; then
        echo "[INFO] Using custom Dockerfile: ${CUSTOM_DOCKERFILE_PATH}"
        cp -rf ${CUSTOM_DOCKERFILE_PATH} ${DOCKER_DAEMON_WORKSPACE}/Dockerfile
      else
        echo "[INFO] Generating Dockerfile for project type: ${PROJECT_TYPE}"
        # Download and execute Dockerfile generation script
        script_download Dockerfile.${TEMPLATE_CONTEXT}.sh
        bash Dockerfile.${TEMPLATE_CONTEXT}.sh "${PROJECT_TYPE}" "multiarch"
      fi

    # 4. Execute multi-architecture build
    - bash build-multiarch.${TEMPLATE_CONTEXT}.sh

  artifacts:
    reports:
      dotenv: "${ENV_FILE}"
    paths:
      - ${ENV_FILE}
    expire_in: 14 days

  rules:
    # Only enable multi-architecture build when variable exists
    - if: '$MULTIARCH_BUILD_ENABLE == "true" && $DOCKER_IMAGE_BUILD == "true"'
      when: on_success
    - when: never

  tags:
    - docker
    - multiarch  # May require dedicated Runner

# ============================================
# Compatibility Mode: Auto select single or multi architecture
# ============================================

build-smart:
  stage: build
  extends:
    - .runner_tag
    - .nexus_auth
    - .harbor_auth
  script:
    # Auto-detect if multi-architecture build is needed
    - |
      if [ "${MULTIARCH_BUILD_ENABLE}" == "true" ]; then
        echo "[INFO] Multi-arch build enabled, using Buildx pipeline"
        # Trigger multi-architecture build
        !reference [build-multiarch, script]
      else
        echo "[INFO] Single-arch build, using traditional pipeline"
        # Trigger traditional build
        script_download build.${TEMPLATE_CONTEXT}.sh
        bash build.${TEMPLATE_CONTEXT}.sh
      fi

  rules:
    - if: '$DOCKER_IMAGE_BUILD == "true"'
      when: on_success
    - when: never
