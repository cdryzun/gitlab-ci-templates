include:
  - local: "vars/*.stable.gitlab-ci.yml"
  - local: "utils/*.stable.gitlab-ci.yml"

stages:
  - test
  - scan
  - deploy
  - clean

# Default operation command image, if you need to use another image separately, please configure it separately in the stage.
default:
  image: ${TOOLBOX_IMAGE}

# Global common variables
variables:
  GLOBAL_DOMAIN: "iquantex.com"
  # Deployment project repository URL
  REPO_URL: "${CI_PROJECT_URL}.git"
  # Project name defined by deployment tool, need to get from operations
  ARGOCD_PROJECT: "${CI_PROJECT_NAME}-${CI_COMMIT_BRANCH}"
  # Environment domain
  ENV_URL: "http://${CI_COMMIT_BRANCH}.${CI_PROJECT_NAMESPACE}.${GLOBAL_DOMAIN}"
  # Production domain
  PROD_DOMAIN: "${CI_PROJECT_NAME}.${CI_PROJECT_NAMESPACE}.${GLOBAL_DOMAIN}"
  KUBE_NAMESPACE: "${CI_PROJECT_NAME}-${CI_COMMIT_BRANCH}"
  ARGOCD_ENV: "${CI_PROJECT_NAME}-${CI_COMMIT_BRANCH}"
  extends: .default_vars
  TEMPLATE_CONTEXT: 'stable'

# Check charts syntax before merge
all_charts_syntax_check:
  stage: test
  script:
    - for i in $(ls |grep -Ev 'README|sync.sh|argocd|.gitlab|plottool|turing-ide');do helm lint $i 2>/dev/null;done

.deploy_env: &deploy_env
  environment:
    name: ${CI_COMMIT_BRANCH}
    url: ${ENV_URL}

.deploy_rule: &deploy_rule
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: $CI_COMMIT_REF_PROTECTED
      changes:
       - ${CI_PROJECT_DIR}/**/*.yaml
      variables:
        ACTION: "create_all"
      when: manual

.get_sync_sh:
  before_script:
    - |
      curl -fsSL --header "PRIVATE-TOKEN: ${GITLAB_READ_TOKEN}" ${TEMPLATE_REPO%/devops*}/api/v4/projects/${TEMPLATE_REPO_PROJECT_ID}/repository/files/scripts%2Fsync.${TEMPLATE_CONTEXT}.sh/raw?ref=${TEMPLATE_BRANCH_NAME} -o sync.sh
      chmod +x ./sync.sh
    - |
      # Note: argocd CLI is pre-installed in glci-toolbox image
      if [ ! -e /usr/local/bin/argocd ]; then
        echo "Error: argocd CLI not found. Please use glci-toolbox image."
        exit 1
      fi

.argocd_exec: &argocd_exec
  script:
    - | 
      # Match action
      case ${ACTION} in
        "create_all")
          # Execute create all deployments
          bash ./sync.sh create ${REPO_URL} ${KUBE_NAMESPACE} ${ARGOCD_PROJECT} ${ARGOCD_ENV}
          ;;
        "sync_all")
          # Execute force sync all deployments
          bash ./sync.sh sync ${REPO_URL} ${KUBE_NAMESPACE} ${ARGOCD_PROJECT} ${ARGOCD_ENV}
          ;;
        "delete_all")
          # Execute delete all deployment environments
          bash ./sync.sh delete ${REPO_URL} ${KUBE_NAMESPACE} ${ARGOCD_PROJECT} ${ARGOCD_ENV}
          ;;
          *)
          echo "nothing to do, goto next"
          ;;
      esac
      # If command variable and application name are set, only update single application
      if [ ${CMD} ] && [ ${APP_NAME} ];then
        bash ./sync.sh ${CMD} ${REPO_URL} ${KUBE_NAMESPACE} ${ARGOCD_PROJECT} ${ARGOCD_ENV} ${APP_NAME}
      fi

.clean_config: &clean_config
  after_script:
    - echo "clean config"
    - if [ -e ~/.argocd/config ];then rm -f ~/.argocd/config;fi

.deploy_to_cluster:
  stage: deploy
  extends:
    - .gitlab_auth
    - .argocd_auth
    - .runner_tag
    - .deploy_env
    - .deploy_rule
    - .get_sync_sh
    - .argocd_exec
    - .clean_config

# Create all application deployments
Create_Apps_To_Cluster:
  extends: .deploy_to_cluster

# Force sync all application deployments in environment
Sync_Apps_To_Cluster:
  extends: .deploy_to_cluster
  rules:
    - if: $CI_COMMIT_REF_PROTECTED
      changes:
       - ${CI_PROJECT_DIR}/**/*.yaml
      variables:
        ACTION: "sync_all"
      when: manual

# Delete all application deployments in environment, only operable when manually running pipeline, and requires manual operation to prevent accidental operation.
Delete_Apps_From_Cluster:
  extends: .deploy_to_cluster
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED && $CI_PIPELINE_SOURCE == "web"'
      variables:
        ACTION: "delete_all"
      when: manual
      # If not manually executing pipeline, operation is not allowed
    - if: $CI_PIPELINE_SOURCE != "web"
      when: never

# Force sync specified application deployment in development environment, execute corresponding action based on trigger parameters, such as create, sync, delete application operations.
Sync_One_Apps_To_Cluster:
  extends: .deploy_to_cluster
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $APP_NAME && $CMD'
      when: always
    - if: $APP_NAME && $CMD
      when: manual

workflow:
  rules:
    !reference [ .argocd_trigger, rules ]