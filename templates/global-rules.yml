.release_version: &release_version
  if: '$CI_COMMIT_REF_NAME =~ /^v\d+\.\d+\.\d+(-{1}([a-zA-Z0-9.]{2,8}))?$/'
  variables:
    RELEASE_BUILD: 'true'

.default_trigger_vars: &default_trigger_vars
  # extends: .default_vars
  RELEASE_BUILD: "false"

workflow:
  rules:
    - if: '$CI_COMMIT_REF_NAME == "prd"'
      variables:
        RELEASE_BUILD: "false"
        DOCKER_IMAGE_SCAN_IMAGE: "false"
        DOCKER_IMAGE_BUILD: "false"
        SIT_CD_AUTO_DEPLOY: "false"
    - *release_version
    # 且 dev|sit|prd|feat|bugfix|hotfix 开头，已 - 进行连接 的可以触发；$CI_COMMIT_BEFORE_SHA 过滤掉创建新分支 触发
    - if: '$CI_COMMIT_REF_NAME =~ /^(dev|sit)$/ 
        && ($CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000" || $CI_PIPELINE_SOURCE == "web")'
      variables:
        *default_trigger_vars
    - if: '$CI_COMMIT_REF_NAME =~ /^(feat|bugfix|hotfix)((-){1}[_0-9a-z]{1,12})?(\/{1}[a-z0-9]{2,6})?$/ 
        && ($CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000" || $CI_PIPELINE_SOURCE == "web")' 
      variables:
        RELEASE_BUILD: "false"
        FEAT_BRANCH: "true"
    - if: '$CI_COMMIT_REF_NAME =~ /^prd-\d+-[a-z0-9]+-[0-9]+$/'
      variables:
        extends: .default_trigger_vars
    - if: '$CI_PIPELINE_SOURCE == "schedule" 
      && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always

