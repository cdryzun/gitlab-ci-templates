###############################  GOLANG Project Example
# Feature switches reference: vars/default-vars.stable.gitlab-ci.yml

variables:
  BUILD_SHELL: "go build -ldflags '-s -w' -o $CI_PROJECT_NAME ./"
  UNIT_TEST_ENABLE: "false" # Whether to disable unit tests (to enable, set GO_TEST: "true")
  DOCKER_IMAGE_SCAN_IMAGE: "false" # Whether to enable image scanning
  DEV_CD_AUTO_DEPLOY: "true" # DEV CD auto deploy
  SIT_CD_AUTO_DEPLOY: "true" # SIT CD auto deploy
  PRD_BUILD_CREATE_TAG: "true" # PRD CI auto create Tag
  FEAT_DOCKER_IMAGE_BUILD: "false"  # Whether to build Docker image on feat branch
  FEAT_CD_AUTO_DEPLOY: "true" # feat auto deploy
  ENV_FILE: build.env
  # Golang build parameters (optional)
  GO_CGO_ENABLED: "0"
  GO_ARCH: "amd64"

include:
  - project: 'devops/ci-templates'
    ref: devops
    file: 'jobs-templates/golang.latest.gitlab-ci.yml'

