test:
  extends:
    - .maven_test
    - .unit_test_base
    - .runner_tag

build:
  extends:
    - .custom_build
  script:
    - |
      cat > run.sh << EOF
      set -eo # 表示开启 pipeline 模式，执行期间发生错误，后续步骤多不进行执行。
      pnpm install
      pnpm run build
      EOF
      chmod a+x ./run.sh \
      && shell_exec ./run.sh

