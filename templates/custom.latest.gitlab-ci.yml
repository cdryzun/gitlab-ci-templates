# 导入公共模板
include:
  - remote: 'https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/open/jobs-templates/custom.latest.gitlab-ci.yml'

# 载入默认变量 ，变量值可以被上层替换
# 变量优先级  script(bash) > gitlab web >  gitlab template > os system default;
# 其中 gitlab web 又存在有优先级问题：
# gitlab project > gitlab group > gitlab platform default
variables:
  extends: .default_vars

