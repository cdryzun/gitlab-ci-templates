# Open Source Version - Auto DevOps Template
# This file uses remote includes to reference files from GitHub
# Base URL: https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/open/

include:
  - remote: 'https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/open/jobs-templates/Auto-DevOps.gitlab-ci.yml'

# Feature flags reference: https://raw.githubusercontent.com/cdryzun/gitlab-ci-templates/open/vars/default-vars.stable.gitlab-ci.yml

###############################  JAVA Project Example
# variables:
#   BUILD_SHELL: "mvn clean package -Dmaven.test.skip=true"
#   UNIT_TEST_ENABLE: "true"

### JAVA project with jar not in root directory
# variables:
#   BUILD_SHELL: "mvn clean install -Dmaven.test.skip=true \
#     && mkdir -p ./target \
#     && mv spring-cloud-gateway/target/spring-cloud-gateway.jar ./target/app.jar"
#   UNIT_TEST_ENABLE: "true"

### JAVA scaffold project, no image build, only upload artifacts to nexus
# variables:
#   BUILD_SHELL: "mvn clean install -Dmaven.test.skip=true \
#     && mkdir -p ./target \
#     && mv spring-cloud-gateway/target/spring-cloud-gateway.jar ./target/app.jar"
#   UNIT_TEST_ENABLE: "true"
#   DOCKER_IMAGE_BUILD: "false"

### For projects where pom.xml is not in root directory
# variables:
#   BUILD_MAVEN_POM_FILE: "spring-cloud-gateway/pom.xml"
#   BUILD_SHELL: "mvn clean install -Dmaven.test.skip=true \
#     && mkdir -p ./target \
#     && mv spring-cloud-gateway/target/*.jar ./target/app.jar"
#   UNIT_TEST_ENABLE: "true"


